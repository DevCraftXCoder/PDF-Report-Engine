[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "reportlab-engine"
version = "0.1.0"
description = "ReportLab-powered PDF report generator — enterprise-grade multi-section reports with diagrams"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
  { name = "Frxncois", email = "joweypf@gmail.com" }
]
keywords = ["pdf", "report", "reportlab", "generator", "enterprise"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Text Processing :: Markup",
  "Intended Audience :: Developers",
]
dependencies = [
  "reportlab==4.5.0",
  "reportlab-chinese-fonts==0.0.1",
  "Pillow>=10.0.0,<12.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.4.0",
  "mypy>=1.8.0",
  "types-Pillow>=10.0.0",
]

[project.scripts]
pdf-report = "reportlab_engine.cli:main"

[project.urls]
Homepage = "https://github.com/DevCraftXCoder/PDF-Report-Engine"
Repository = "https://github.com/DevCraftXCoder/PDF-Report-Engine.git"
"Bug Tracker" = "https://github.com/DevCraftXCoder/PDF-Report-Engine/issues"

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
target-version = "py38"
line-length = 88
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.8"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-v --tb=short"
